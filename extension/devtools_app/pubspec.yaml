name: testeador_devtools_extension
description: >-
  DevTools extension de testeador para la siembra en vivo de personas: lista los
  fixtures/actores disponibles en la app inspeccionada y, al elegir uno, invoca
  su service extension ext.stabilitas.setPersona.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
