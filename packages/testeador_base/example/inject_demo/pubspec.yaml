name: inject_demo
description: >-
  Pure-Dart example demonstrating testeador's `TestInjector` codegen — picks
  up existing `test()` blocks from `test/` and composes them as steps of a
  `TestFlow` via static getters, name lookups, tag lookups, and regex
  lookups.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  testeador_base:
    path: ../../

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.5.15
  test: ^1.31.0

dependency_overrides:
# dev_mate* no está publicado y testeador_base lo resuelve con overrides
# internos que NO viajan al consumidor: hay que repetirlos acá.
  dev_mate:
    path: ../../../../../packages/dev_mate/packages/dev_mate
  dev_mate_client:
    path: ../../../../../packages/dev_mate/packages/dev_mate_client
  dev_mate_mcp:
    path: ../../../../../packages/dev_mate/packages/dev_mate_mcp
